steps:
  # 1. Run automated unit & 30-sample evaluation tests
  - name: 'ghcr.io/astral-sh/uv:python3.11-bookworm'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        cd backend
        uv run pytest -v

  # 2. Build Docker container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/foodloop-backend:$COMMIT_SHA', './backend']

  # 3. Push to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/foodloop-backend:$COMMIT_SHA']

  # 4. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'foodloop-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/foodloop-backend:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/foodloop-backend:$COMMIT_SHA'
